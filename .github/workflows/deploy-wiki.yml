name: Deploy game and codex to GitHub Pages

# The site root is the playable web build of the game (the same code the Windows desktop app runs).
# The bilingual Aetheria Codex lives at /wiki/. Its data bundle and sprite engine are regenerated
# from the game's src/data on every deploy, so the live codex always matches the source on main.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (no Electron binary needed)
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Generate the codex from src/data
        run: npm run wiki:build

      - name: Type-check and build the game
        run: npm run build

      - name: Assemble the site
        run: |
          mkdir -p site/wiki
          cp -r dist/. site/
          cp -r wiki/. site/wiki/
          touch site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
